name: Fix student login destination

on:
  push:
    paths:
      - '.github/workflows/fix-student-login-destination.yml'
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update student destination
        shell: python
        run: |
          from pathlib import Path
          p = Path('Login/js/app.js')
          s = p.read_text(encoding='utf-8')
          old = "../Students/index.html"
          new = "../Student/index.html"
          count = s.count(old)
          if count == 0:
              raise SystemExit('No Students/index.html references found')
          s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          print(f'Replaced {count} student destination references')
      - name: Update server landing
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/server.py')
          s = p.read_text(encoding='utf-8')
          old = 'USER_LANDING        = "../Students/index.html"'
          new = 'USER_LANDING        = "../Student/index.html"'
          if old not in s:
              raise SystemExit('Expected USER_LANDING line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Login/js/app.js server/server.py
          git diff --cached --quiet || git commit -m 'Route students to Student page'
          git push