name: One-off update gradebook subtitle
on:
  push:
    paths:
      - '.github/workflows/one-off-update-gradebook-subtitle.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("Teacher's/index.html")
          text = path.read_text(encoding="utf-8-sig")
          old = "No students have signed up yet. Share the Login page link with your students."
          new = "Students that create an account from the Login page will appear here automatically."
          if old not in text:
              raise SystemExit("Target gradebook subtitle was not found.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit page change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Teacher's/index.html"
          git commit -m "Clarify teacher gradebook guidance"
          git push origin HEAD:main
      - name: Remove one-off workflow
        run: |
          git rm .github/workflows/one-off-update-gradebook-subtitle.yml
          git commit -m "Remove one-off gradebook subtitle workflow"
          git push origin HEAD:main
