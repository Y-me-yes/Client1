name: One-off update active content message

on:
  push:
    paths:
      - '.github/workflows/one-off-update-active-content-message.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("Teacher's/index.html")
          text = path.read_text(encoding="utf-8-sig")
          old = "No active content. Tap the + button to send your first challenge or notification."
          new = "No active content yet. Use the + button to create a challenge or notification for your students."
          if old not in text:
              raise SystemExit("Target active content empty message was not found.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit page change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Teacher's/index.html"
          git commit -m "Clarify active content guidance"
          git push origin HEAD:main
      - name: Remove one-off workflow
        run: |
          git rm .github/workflows/one-off-update-active-content-message.yml
          git commit -m "Remove one-off active content workflow"
          git push origin HEAD:main
