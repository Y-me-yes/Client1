name: Update FAB descriptions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update approved descriptions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("Teacher's/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("Set a prompt with a custom expiry", "Create a challenge with the deadline you wish.")
          s = s.replace("A message that archives when everyone has seen it", "Send an announcement to your students, no replies. Notifications archive when seen by all")
          p.write_text(s, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Teacher's/index.html"
          git diff --cached --quiet && exit 0
          git commit -m "Update Teacher FAB descriptions"
          git push
