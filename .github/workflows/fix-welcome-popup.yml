name: Fix Teacher welcome popup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-welcome-popup.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make welcome popup open on page load
        shell: python
        run: |
          from pathlib import Path
          p = Path("Teacher's/js/app.js")
          text = p.read_text(encoding="utf-8")
          old = '''    // First-visit welcome: shows the very first time this tab opens the app.\n    // The flag lives in sessionStorage (cleared when the tab/window closes), so\n    // reloading the page keeps it hidden — but launching Start Website.bat again\n    // opens a fresh tab/session, so the welcome reappears.\n    let hasSeenWelcome = false;\n    try { hasSeenWelcome = sessionStorage.getItem(WELCOME_KEY) === '1'; } catch (err) { /* ignore */ }\n    if (!hasSeenWelcome) actions.openWelcome();'''
          new = '''    // Welcome popup: show it whenever the Teacher page is opened.\n    // Closing it still dismisses it for the current page; a new page load\n    // starts with the welcome visible again.\n    actions.openWelcome();'''
          if old not in text:
              raise SystemExit("Expected welcome init block was not found")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Teacher's/js/app.js"
          git commit -m "fix: show Teacher welcome popup on page open [skip ci]"
          git rm .github/workflows/fix-welcome-popup.yml
          git commit -m "chore: remove temporary welcome popup workflow [skip ci]"
          git push