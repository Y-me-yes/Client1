name: One-off update empty gradebook text

on:
  push:
    paths:
      - '.github/workflows/one-off-update-empty-gradebook.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("Teacher's/index.html")
          text = path.read_text(encoding="utf-8-sig")
          old = "Students create their own accounts from the Login page. Once they sign up, their name appears here and you can award them points.</p>"
          new = "Students create their own accounts from the Login page. Once they sign up, their name appears here and you can award them points or set challenges for them.</p>"
          if old not in text:
              raise SystemExit("Target empty-state text was not found.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit page change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Teacher's/index.html"
          git commit -m "Clarify teacher gradebook empty-state guidance"
          git push origin HEAD:main
      - name: Remove one-off workflow
        run: |
          git rm .github/workflows/one-off-update-empty-gradebook.yml
          git commit -m "Remove one-off gradebook text workflow"
          git push origin HEAD:main
