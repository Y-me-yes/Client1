name: Fix documentation heading
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update heading
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("Teacher's/index.html")
          text = path.read_text(encoding="utf-8")
          old = "Share content with the + button"
          new = "Create content with the + button"
          if text.count(old) != 1:
              raise SystemExit(f"Expected 1 match, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Teacher's/index.html"
          git commit -m "Fix documentation content heading"
          git push
