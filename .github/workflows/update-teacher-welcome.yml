name: Update teacher welcome

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-teacher-welcome.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply exact edited teacher welcome
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("Teacher's/index.html")
          s = p.read_text(encoding="utf-8")

          welcome = '''
          <!-- ===== WELCOME DIALOG (first visit per tab session) ===== -->
          <div class="welcome-backdrop" id="welcomeDialog" hidden>
            <div class="dialog dialog-wide" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle">
              <div class="dialog-header">
                <h2 id="welcomeTitle">Welcome to 1% Healthy Habit!</h2>
                <button class="icon-btn" data-close-dialog="welcomeDialog" type="button" aria-label="Close">&times;</button>
              </div>
              <div class="dialog-body">
                <p class="dialog-context">You should know, you’re not just opening a dashboard. You’re stepping into a community where your guidance can help students grow — one small, healthy habit at a time.</p>

                <p>As a teacher, you have an important role in helping your students build consistency, self-discipline, positive habits, accountability, and personal growth.</p>

                <p>Use this forum to manage your students, award points, create challenges, send notifications, review their replies, and encourage them along their journey.</p>

                <p><strong>A few things to remember:</strong></p>
                <ol>
                  <li><strong>Lead by example.</strong> Your encouragement can make a real difference.</li>
                  <li><strong>Celebrate consistency.</strong> Small improvements deserve recognition.</li>
                  <li><strong>Keep students growing.</strong> Every chalenge, point, and piece of feeedback is an opportunity to help them become better.</li>
                </ol>

                <p><strong>Together, we can help students become 1% better every day.</strong></p>

                <p>Welcome to the teacher's side of the circle. 🌱</p>
              </div>
              <div class="dialog-footer">
                <button class="btn btn-primary" id="welcomeCtaBtn" data-close-dialog="welcomeDialog" type="button">Got it — let's begin</button>
              </div>
            </div>
          </div>
          '''

          def replace_div_by_id(text, element_id, replacement):
              m = re.search(r'<div\\b[^>]*\\bid=["\\']' + re.escape(element_id) + r'["\\'][^>]*>', text)
              if not m:
                  return None
              start = m.start()
              depth = 0
              token_re = re.compile(r'<div\\b[^>]*>|</div\\s*>', re.I)
              for tok in token_re.finditer(text, m.start()):
                  if tok.group(0).lower().startswith('</div'):
                      depth -= 1
                      if depth == 0:
                          return text[:start] + replacement.strip() + text[tok.end():]
                  else:
                      depth += 1
              raise RuntimeError(f'Could not find closing div for {element_id}')

          updated = replace_div_by_id(s, 'welcomeDialog', welcome)
          if updated is None:
              marker = '  <!-- ===== AWARD SCORE DIALOG ===== -->'
              if marker not in s:
                  raise RuntimeError('Award Score dialog marker not found')
              updated = s.replace(marker, welcome + '\\n\\n' + marker, 1)

          p.write_text(updated, encoding='utf-8')

      - name: Remove one-shot workflow
        run: |
          rm -f .github/workflows/update-teacher-welcome.yml

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "Teacher's/index.html" .github/workflows/update-teacher-welcome.yml
          git diff --cached --quiet || git commit -m 'update: apply edited teacher forum welcome'
          git push
