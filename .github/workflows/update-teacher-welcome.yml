name: Update Teacher Welcome Message

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-welcome:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update welcome message
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("Teacher's/index.html")
          text = p.read_text(encoding="utf-8")
          old = 'Students that create an account from the Login page will appear here automatically.'
          new = '''<strong>Hi teacher, welcome to your platform! 👋</strong><br>
          Here, you can manage your students, create challenges, send messages, award points, and support them as they build healthy habits and become 1% better every day. 🌱'''
          # Replace the existing gradebook helper only if the requested welcome text is not already present.
          if new not in text:
              target = 'Students that create an account from the Login page will appear here automatically.'
              if target not in text:
                  raise SystemExit("Could not find the current Teacher welcome text.")
              text = text.replace(target, new, 1)
              p.write_text(text, encoding="utf-8")
          PY

      - name: Commit update and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Teacher's/index.html"
          git rm .github/workflows/update-teacher-welcome.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: update Teacher welcome message [skip ci]"
          git push
