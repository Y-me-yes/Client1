name: Fix student redirect

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix student login redirect'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix redirect path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Login/js/app.js')
          text = p.read_text(encoding='utf-8-sig')
          old = "new URL('../Student/index.html', window.location.href)"
          new = "new URL('../Students/index.html', window.location.href)"
          if old not in text:
              raise SystemExit('Expected student redirect fallback was not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Login/js/app.js"
          git commit -m "Fix student login redirect"
          git push
