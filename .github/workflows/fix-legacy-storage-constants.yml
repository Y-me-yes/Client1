name: Fix legacy storage constants

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add legacy storage constants
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("Teacher's/js/app.js")
          s = p.read_text(encoding="utf-8")
          old = "  const WELCOME_KEY  = 'healthy-habit.welcomed.v1';\n  const API_BASE"
          new = "  const WELCOME_KEY  = 'healthy-habit.welcomed.v1';\n  const LEGACY_STORAGE_KEY = 'sst.students.v1';\n  const LEGACY_WELCOME_KEY = 'sst.welcomed.v1';\n  const API_BASE"
          if old not in s:
              raise SystemExit("Expected constants block not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Teacher's/js/app.js"
          git commit -m "Define legacy teacher storage keys"
          git push
