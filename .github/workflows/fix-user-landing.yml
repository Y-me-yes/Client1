name: Fix canonical user landing
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make student landing canonical
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server/server.py')
          s = p.read_text(encoding='utf-8-sig')
          old = 'USER_LANDING        = env("USER_LANDING", "../Students/index.html")'
          new = 'USER_LANDING        = "../Students/index.html"'
          if old not in s:
              raise SystemExit('Expected USER_LANDING configuration was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.py
          git commit -m "Fix canonical student landing"
          git push
