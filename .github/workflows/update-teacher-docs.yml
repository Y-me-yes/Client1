name: Update Teacher documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-docs:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update outdated documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("Teacher's/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("<h3 class=\"docs-hero-title\">Up and running in 30 seconds.</h3>", "<h3 class=\"docs-hero-title\">Up and running in a jiffy.</h3>")
          s = s.replace("<p class=\"docs-hero-lede\">No setup, no sign-in, no clutter. Add your first student, hand out a few points, and you'll get the hang of it instantly.</p>", "<p class=\"docs-hero-lede\">Sign in as a teacher to manage your students, award points, create challenges and notifications, and review student replies. Students create their own accounts from the Login page and appear here automatically.</p>")
          s = s.replace("<h4 class=\"docs-section-title\">Add, award &amp; manage</h4>", "<h4 class=\"docs-section-title\">Award &amp; manage students</h4>")
          p.write_text(s, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Teacher's/index.html"
          git diff --cached --quiet && exit 0
          git commit -m "Update teacher documentation for current student flow"
          git push
