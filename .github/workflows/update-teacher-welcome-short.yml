name: Update teacher welcome message

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-teacher-welcome-short.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace welcome dialog
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path("Teacher's/index.html")
          s = p.read_text(encoding="utf-8")

          pattern = r'<div\b[^>]*\bid=["\']welcomeDialog["\'][^>]*>.*?</div>\s*</div>'
          replacement = '''<div class="welcome-backdrop" id="welcomeDialog" hidden>
    <div class="dialog dialog-wide" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle">
      <div class="dialog-header">
        <h2 id="welcomeTitle">Welcome to 1% Healthy Habit!</h2>
        <button class="icon-btn" data-close-dialog="welcomeDialog" type="button" aria-label="Close">&times;</button>
      </div>
      <div class="dialog-body">
        <p class="dialog-context">Hi teacher, welcome to your platform! 👋</p>
        <p>Here, you can manage your students, create challenges, send messages, award points, and support them as they build healthy habits and become 1% better every day. 🌱</p>
      </div>
      <div class="dialog-footer">
        <button class="btn btn-primary" id="welcomeCtaBtn" data-close-dialog="welcomeDialog" type="button">Got it — let's begin</button>
      </div>
    </div>
  </div>'''

          m = re.search(pattern, s, flags=re.S)
          if not m:
              raise RuntimeError("welcomeDialog not found")
          s = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s, encoding="utf-8")

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/update-teacher-welcome-short.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "Teacher's/index.html" .github/workflows/update-teacher-welcome-short.yml
          git diff --cached --quiet || git commit -m 'update: shorten teacher welcome message'
          git push
