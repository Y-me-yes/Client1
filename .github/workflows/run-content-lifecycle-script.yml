name: Run content lifecycle script
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_content_lifecycle.py'
      - '.github/content-lifecycle-run.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply changes
        run: python scripts/apply_content_lifecycle.py
      - name: Validate and commit
        shell: bash
        run: |
          set -e
          python -m py_compile server/server.py
          node --check 'Student/js/app.js'
          node --check "Teacher's/js/app.js"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/server.py Student/js/app.js "Teacher's/js/app.js" "Teacher's/index.html" scripts/apply_content_lifecycle.py
          git commit -m 'feat: enforce content lifecycle and archive rules'
          git push origin HEAD:main
