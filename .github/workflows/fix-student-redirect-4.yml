name: Enforce student landing page
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce canonical student destination
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Login/js/app.js')
          s = p.read_text(encoding='utf-8-sig')

          marker1 = "        showSnack(`Welcome to the circle, ${username}!`, 'success');\n        let target;"
          repl1 = "        showSnack(`Welcome to the circle, ${username}!`, 'success');\n        // Plain student signup always uses the canonical Students page.\n        data.redirect = '../Students/index.html';\n        let target;"

          marker2 = "        const role = data.role || 'student';\n"
          repl2 = "        const role = data.role || 'student';\n        // Never allow a stale server landing setting to redirect students\n        // to an old page. Teachers keep their dedicated landing page.\n        if (role !== 'teacher') data.redirect = '../Students/index.html';\n"

          if marker1 not in s:
              raise SystemExit('Signup redirect marker not found')
          if marker2 not in s:
              raise SystemExit('Role marker not found')
          s = s.replace(marker1, repl1, 1)
          s = s.replace(marker2, repl2, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Login/js/app.js
          git commit -m "Enforce student landing page"
          git push
