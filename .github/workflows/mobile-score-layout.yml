name: Apply mobile score layout
on:
  push:
    paths:
      - '.github/workflows/mobile-score-layout.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update mobile teacher cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("Teacher's/css/styles.css")
          s = p.read_text(encoding="utf-8")
          marker = "\n/* ===== MOBILE SCORE VISIBILITY ===== */\n"
          if marker not in s:
              s += marker + """
@media (max-width: 720px) {
  .student-card-stats {
    display: grid;
    grid-template-columns: minmax(96px, 0.7fr) minmax(0, 1.3fr);
    align-items: stretch;
    gap: 8px;
  }

  .student-card-stats .score-pill {
    font-size: 17px;
    font-weight: 800;
    min-width: 0;
    min-height: 48px;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    text-align: left;
  }
}
"""
          p.write_text(s, encoding="utf-8")
          PY
          rm -f .github/workflows/mobile-score-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Teacher's/css/styles.css" .github/workflows/mobile-score-layout.yml
          git diff --cached --quiet || git commit -m "fix: make mobile student scores prominent"
          git push
