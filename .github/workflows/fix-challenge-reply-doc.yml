name: Fix challenge reply documentation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace contradictory reply wording
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("Teacher's/index.html")
          text = path.read_text(encoding="utf-8")
          old = "Every reply has BOTH"
          new = "Each reply can include text, media, or both. Students must provide at least one of the two."
          if text.count(old) != 1:
              raise SystemExit(f"Expected 1 documentation match, found {text.count(old)}")
          start = text.index(old)
          end = text.index(".", start) + 1
          path.write_text(text[:start] + new + text[end:], encoding="utf-8")
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Teacher's/index.html"
          git commit -m "Fix challenge reply documentation wording"
          git push
