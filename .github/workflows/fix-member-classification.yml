name: Fix member classification tabs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix hidden member tab panel
        shell: python
        run: |
          from pathlib import Path

          path = Path("Teacher's/css/styles.css")
          text = path.read_text(encoding="utf-8")
          marker = ".tab-panel { display: flex; flex-direction: column; gap: 8px; min-height: 60px; }"
          fix = marker + "\n.tab-panel[hidden] { display: none !important; }"

          if ".tab-panel[hidden]" in text:
              print("Fix already present; nothing to do.")
          elif marker not in text:
              raise SystemExit("Could not find the .tab-panel rule; refusing to edit.")
          else:
              text = text.replace(marker, fix, 1)
              path.write_text(text, encoding="utf-8")
              print("Added explicit hidden-state rule for member tab panels.")

      - name: Commit fix and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-member-classification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Teacher's/css/styles.css" .github/workflows/fix-member-classification.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: keep ghost member panel hidden when active tab is selected"
          git push
