name: Fix Copy documentation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Copy documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("Teacher's/index.html")
          s = p.read_text(encoding="utf-8")
          old = "Click — Copy in the top bar grabs a leaderboard-formatted list."
          new = "Click <strong>Copy</strong> in the top bar to copy the student list to your clipboard in leaderboard format."
          if old not in s:
              raise SystemExit("Target documentation sentence not found")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Teacher's/index.html"
          git commit -m "Clarify teacher Copy documentation"
          git push
