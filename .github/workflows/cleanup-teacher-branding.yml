name: Cleanup Teacher internal branding

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean outdated internal branding and preserve existing local data
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("Teacher's/js/app.js")
          s = p.read_text(encoding="utf-8")
          s = s.replace("Student Score Tracker — Website", "1% Healthy Habit — Teacher Dashboard")
          s = s.replace("const STORAGE_KEY = 'sst.students.v1';", "const STORAGE_KEY = 'healthy-habit.students.v1';\n  const LEGACY_STORAGE_KEY = 'sst.students.v1';")
          s = s.replace("const WELCOME_KEY  = 'sst.welcomed.v1';", "const WELCOME_KEY  = 'healthy-habit.welcomed.v1';\n  const LEGACY_WELCOME_KEY = 'sst.welcomed.v1';")
          marker = "  const AVATAR_PALETTE = ['#8B5CF6', '#10B981', '#F43F5E', '#F59E0B', '#3B82F6', '#EC4899', '#14B8A6', '#6366F1'];"
          migration = marker + "\n\n  // One-time migration from the old internal storage keys so existing teacher data is preserved.\n  try {\n    if (!localStorage.getItem(STORAGE_KEY)) {\n      const legacyStudents = localStorage.getItem(LEGACY_STORAGE_KEY);\n      if (legacyStudents) localStorage.setItem(STORAGE_KEY, legacyStudents);\n    }\n  } catch (err) { /* ignore storage migration errors */ }\n  try {\n    if (!sessionStorage.getItem(WELCOME_KEY)) {\n      const legacyWelcome = sessionStorage.getItem(LEGACY_WELCOME_KEY);\n      if (legacyWelcome) sessionStorage.setItem(WELCOME_KEY, legacyWelcome);\n    }\n  } catch (err) { /* ignore session migration errors */ }"
          s = s.replace(marker, migration, 1)
          p.write_text(s, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Teacher's/js/app.js"
          git diff --cached --quiet && exit 0
          git commit -m "Preserve teacher data during branding cleanup"
          git push
