name: One-off delete fix

on:
  push:
    paths:
      - '.github/workflows/one-off-fix-delete.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch delete flow
        shell: python
        run: |
          from pathlib import Path

          server = Path("server/server.py")
          text = server.read_text(encoding="utf-8")
          old = '''        # Throttle the (single) teacher account, same as _teacher_signin.\n        now_ms = _rl_now()\n        ip_key = "ip:" + _client_ip(self)\n        for key in (f"teacher:{TEACHER_USERNAME.lower()}", ip_key):\n            locked, retry = _rl_consume(\n                _login_buckets, key, now_ms,\n                _LOGIN_MAX_FAILS, _LOGIN_WINDOW_MS, _LOGIN_LOCKOUT_MS,\n            )\n            if locked:\n                return _send(self, 429, _rl_locked_response(retry))\n\n        # Constant-time compare on the teacher password.\n        pass_ok = hmac.compare_digest(password.encode("utf-8"), TEACHER_PASSWORD.encode("utf-8"))\n        if not pass_ok:\n            return _send(self, 401, {"error": "Wrong username or PIN."})\n'''
          new = '''        # Use the same centralized teacher check as every other teacher-only\n        # write endpoint. This avoids the delete path drifting away from the\n        # working teacher authentication rules.\n        teacher_error = self._require_teacher(password)\n        if teacher_error:\n            status, payload = teacher_error\n            return _send(self, status, payload)\n'''
          if old not in text:
              raise SystemExit("server delete auth block not found")
          text = text.replace(old, new, 1)

          old2 = '''            users = [u for u in users if u["username"].lower() != username.lower()]\n            save_users(users)\n\n        _rl_success(_login_buckets, f"teacher:{TEACHER_USERNAME.lower()}")\n        return _send(self, 200, {"ok": True, "username": target["username"]})\n'''
          new2 = '''            users = [u for u in users if u["username"].lower() != username.lower()]\n            save_users(users)\n\n            # Verify persistence before reporting success. In Mongo mode a\n            # storage failure used to be logged and swallowed by the generic\n            # writer, which could make the UI believe a delete succeeded even\n            # though the account still existed.\n            remaining = load_users()\n            if any(u.get("username", "").lower() == username.lower() for u in remaining):\n                return _send(self, 500, {"error": "The account could not be removed from storage. Please try again."})\n\n        return _send(self, 200, {"ok": True, "username": target["username"]})\n'''
          if old2 not in text:
              raise SystemExit("server delete persistence block not found")
          text = text.replace(old2, new2, 1)
          server.write_text(text, encoding="utf-8")

          app = Path("Teacher's/js/app.js")
          text = app.read_text(encoding="utf-8")
          old3 = '''    // Hard-delete a server account. Returns true on 200, false on any failure\n    // (network, wrong password, missing user, rate-limited, etc.). The local\n    // gradebook row is only removed by the caller after this resolves true.\n    deleteStudentRemote(username, teacherPassword) {\n      return fetch(API_BASE + '/api/delete-student', {\n        method: 'POST',\n        cache: 'no-store',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify({ username, teacherPassword }),\n      })\n        .then(res => res.ok)\n        .catch(err => {\n          console.warn('deleteStudentRemote failed:', err);\n          return false;\n        });\n    },\n'''
          new3 = '''    // Hard-delete a server account. Return the actual server result so the\n    // caller can distinguish wrong password, missing account, storage failure,\n    // and a genuine network failure.\n    deleteStudentRemote(username, teacherPassword) {\n      return fetch(API_BASE + '/api/delete-student', {\n        method: 'POST',\n        cache: 'no-store',\n        headers: { 'Content-Type': 'application/json' },\n        body: JSON.stringify({ username, teacherPassword }),\n      })\n        .then(async res => {\n          let data = null;\n          try { data = await res.json(); } catch (err) { /* empty/non-JSON response */ }\n          return { ok: res.ok, status: res.status, error: data && data.error ? data.error : '' };\n        })\n        .catch(err => {\n          console.warn('deleteStudentRemote failed:', err);\n          return { ok: false, status: 0, error: "Couldn't reach the server." };\n        });\n    },\n'''
          if old3 not in text:
              raise SystemExit("frontend deleteRemote block not found")
          text = text.replace(old3, new3, 1)

          old4 = '''      actions.deleteStudentRemote(stu.studentName, pwd).then(ok => {\n        if (!ok) {\n          update(s => {\n            s.deleteDialog = { open: false, studentId: null };\n            s.snackbar = { id: Date.now(), message: 'Delete failed — wrong password or server unreachable' };\n          });\n          return;\n        }\n        update(s => {\n'''
          new4 = '''      actions.deleteStudentRemote(stu.studentName, pwd).then(result => {\n        if (!result.ok) {\n          const msg = result.error || (result.status === 401\n            ? 'Wrong teacher password.'\n            : result.status === 404\n              ? 'That student account no longer exists.'\n              : result.status === 0\n                ? "Couldn't reach the server."\n                : `Delete failed (HTTP ${result.status}).`);\n          update(s => {\n            s.deleteDialog = { open: false, studentId: null };\n            s.snackbar = { id: Date.now(), message: msg };\n          });\n          return;\n        }\n        update(s => {\n'''
          if old4 not in text:
              raise SystemExit("frontend confirmDelete block not found")
          text = text.replace(old4, new4, 1)
          app.write_text(text, encoding="utf-8")

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/server.py "Teacher's/js/app.js"
          git diff --cached --quiet && { echo "No changes needed"; exit 0; }
          git commit -m "Fix teacher student deletion flow"
          git push
