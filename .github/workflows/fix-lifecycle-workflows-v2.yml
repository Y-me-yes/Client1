name: Fix lifecycle workflow permissions
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: write
  workflows: write
jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.repository }}
          fetch-depth: 0
      - name: Fix temporary workflow permissions
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          changed = False
          for name in ['.github/workflows/trigger-content-lifecycle.yml', '.github/workflows/apply-content-lifecycle-pr.yml', '.github/workflows/apply-content-lifecycle-v2.yml']:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              bad = "subprocess.run(['git','add','server/server.py','Student/js/app.js',\"Teacher's/js/app.js\",\"Teacher's/index.html','.github/workflows/trigger-content-lifecycle.yml'],check=True)"
              good = "subprocess.run(['git','add','server/server.py','Student/js/app.js',\"Teacher's/js/app.js\",\"Teacher's/index.html\",\".github/workflows/trigger-content-lifecycle.yml\"],check=True)"
              if bad in s:
                  s = s.replace(bad, good, 1); changed = True
              if 'workflows: write' not in s:
                  s = s.replace('permissions:\n  contents: write', 'permissions:\n  contents: write\n  workflows: write', 1); changed = True
              p.write_text(s, encoding='utf-8')
          if changed:
              subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
              subprocess.run(['git','add','.github/workflows'], check=True)
              subprocess.run(['git','commit','-m','fix: allow lifecycle workflow updates'], check=True)
              subprocess.run(['git','push','origin','HEAD:${{ github.event.pull_request.head.ref }}'], check=True)
