name: Replace project logos

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-logos.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace logo files
        shell: bash
        run: |
          LOGO='' 
          printf '%s' "$LOGO" | base64 -d > 'Student/assets/logo-original.png'
          printf '%s' "$LOGO" | base64 -d > "Teacher's/assets/logo-original.png"
      - name: Remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/replace-logos.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'Student/assets/logo-original.png' "Teacher's/assets/logo-original.png" .github/workflows/replace-logos.yml
          git commit -m 'update: replace student and teacher logos'
          git push
