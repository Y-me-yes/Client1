name: Fix teacher page JS

on:
  push:
    paths:
      - '.github/workflows/fix-teacher-js.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete login-link listener
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("Teacher's/js/app.js")
          text = p.read_text(encoding="utf-8")
          old = """    $('#copyLoginLinkBtn').addEventListener('click', async () => {\n      const url = 'http://localhost:8001/';\n      try {\n        await navigator.clipboard.writeText(url);\n        update(s => { s.snackbar = { id: Date.now(), message: 'Login page link copied — paste in WhatsApp' }; });\n      } catch (err) {\n        update(s => { s.snackbar = { id: Date.now(), message: \"Couldn't copy. The link is \" + url }; });\n      }\n    });\n"""
          if old not in text:
              raise SystemExit("Target listener block not found; refusing to modify file")
          p.write_text(text.replace(old, "", 1), encoding="utf-8")
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Teacher's/js/app.js"
          git diff --cached --quiet && exit 0
          git commit -m "Fix teacher page button event wiring"
          git push