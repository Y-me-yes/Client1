name: Configure Brevo email delivery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-brevo.yml'

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Brevo migration
        env:
          SCRIPT_B64: "IyBTd2l0Y2ggdGhlIGVtYWlsIGJhY2tlbmQgdG8gQnJldm8u"
        run: |
          echo "$SCRIPT_B64" | base64 -d > /tmp/noop.py
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('server/server.py')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\ntry:\n    import resend\n    _HAVE_RESEND = True\nexcept Exception:\n    resend = None\n    _HAVE_RESEND = False\n', '\n', s, count=1)
          if 'import urllib.request\n' not in s:
              s = s.replace('import urllib.parse\n', 'import urllib.parse\nimport urllib.request\nimport urllib.error\n', 1)

          start = s.index('# ---------- email (lazy + safe) ----------')
          gmail = s.index('def _send_via_gmail', start)
          new_block = '''# ---------- email (lazy + safe) ----------

# Hosted email uses Brevo's HTTPS transactional-email API. HTTPS works on
# Render's free tier, unlike outbound SMTP. Gmail SMTP remains only as a
# local-development fallback.
BREVO_API_KEY      = env("BREVO_API_KEY", "")
BREVO_SENDER_EMAIL = env("BREVO_SENDER_EMAIL", GMAIL_USER)

def can_send_email() -> bool:
    return bool(BREVO_API_KEY and BREVO_SENDER_EMAIL) or (
        bool(GMAIL_USER) and bool(GMAIL_APP_PASS)
        and not GMAIL_APP_PASS.startswith("replace_")
    )

def _send_via_resend(to: str, subject: str, text: str) -> bool:
    # Compatibility name retained so the existing send_email call site is stable.
    if not (BREVO_API_KEY and BREVO_SENDER_EMAIL):
        return False
    try:
        payload = json.dumps({
            "sender": {"email": BREVO_SENDER_EMAIL, "name": MAIL_FROM_NAME},
            "to": [{"email": to}],
            "subject": subject,
            "textContent": text,
        }).encode("utf-8")
        req = urllib.request.Request(
            "https://api.brevo.com/v3/smtp/email",
            data=payload,
            headers={
                "accept": "application/json",
                "api-key": BREVO_API_KEY,
                "content-type": "application/json",
            },
            method="POST",
        )
        with urllib.request.urlopen(req, timeout=20) as response:
            if 200 <= response.status < 300:
                print(f"[email:brevo] accepted email for {to}", file=sys.stderr)
                return True
            print(f"[email:brevo] unexpected HTTP status: {response.status}", file=sys.stderr)
            return False
    except urllib.error.HTTPError as e:
        try:
            detail = e.read().decode("utf-8", errors="replace")[:500]
        except Exception:
            detail = str(e)
        print(f"[email:brevo] send failed: HTTP {e.code} {detail}", file=sys.stderr)
        return False
    except Exception as e:
        print(f"[email:brevo] send failed: {e}", file=sys.stderr)
        return False

'''
          s = s[:start] + new_block + s[gmail:]

          s = re.sub(
              r'if not can_send_email\(\):\n\s+print\(f"\[auth\] No email backend configured.*?\n\s+elif RESEND_API_KEY:\n\s+print\(f"\[auth\] Email: Resend.*?\n\s+else:\n\s+print\(f"\[auth\] Email: Gmail \(\{GMAIL_USER\}\)", file=sys\.stderr\)',
              '''if not can_send_email():
        print(f"[auth] No email backend configured — emails will be SKIPPED. Set BREVO_API_KEY + BREVO_SENDER_EMAIL (hosted) or GMAIL_USER + GMAIL_APP_PASSWORD (dev) to enable.", file=sys.stderr)
    elif BREVO_API_KEY:
        print(f"[auth] Email: Brevo (sender={BREVO_SENDER_EMAIL})", file=sys.stderr)
    else:
        print(f"[auth] Email: Gmail ({GMAIL_USER})", file=sys.stderr)''',
              s, count=1, flags=re.S
          )

          s = s.replace(
              '"RESEND_API_KEY_set": bool((os.environ.get("RESEND_API_KEY") or "").strip()),',
              '"BREVO_API_KEY_set": bool((os.environ.get("BREVO_API_KEY") or "").strip()),', 1
          )
          p.write_text(s, encoding='utf-8')

          req = Path('server/requirements.txt')
          if req.exists():
              lines = [x for x in req.read_text(encoding='utf-8').splitlines() if not x.strip().lower().startswith('resend')]
              req.write_text('\n'.join(lines).rstrip() + '\n', encoding='utf-8')

          envp = Path('server/.env.example')
          if envp.exists():
              lines = envp.read_text(encoding='utf-8').splitlines()
              out = [x for x in lines if not x.startswith(('GMAIL_USER=', 'GMAIL_APP_PASSWORD=', 'RESEND_API_KEY=', 'MAIL_FROM='))]
              if not any(x.startswith('BREVO_API_KEY=') for x in out):
                  idx = next((i for i,x in enumerate(out) if x.startswith('MAIL_FROM_NAME=')), len(out))
                  out[idx:idx] = ['BREVO_API_KEY=', 'BREVO_SENDER_EMAIL=']
              envp.write_text('\n'.join(out).rstrip() + '\n', encoding='utf-8')
          PY

      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/server.py server/requirements.txt server/.env.example
          git diff --cached --quiet || git commit -m 'fix: send verification emails through Brevo'
          git push
