name: Fix reply archive route
on:
  push:
    paths:
      - 'REPLY_ARCHIVE_ROUTE_TRIGGER.txt'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix route
        shell: python
        run: |
          from pathlib import Path
          p = Path('server/server.py')
          s = p.read_text(encoding='utf-8')
          marker = '        elif self.path == "/api/replies":           return self._post_replies()\n'
          route = '        elif self.path == "/api/replies/archive":   return self._post_reply_archive()\n'
          if route not in s:
              assert marker in s, 'POST replies route not found'
              s = s.replace(marker, marker + route, 1)
              p.write_text(s, encoding='utf-8')
              print('POST reply archive route added.')
          else:
              print('POST reply archive route already present.')
          Path('REPLY_ARCHIVE_ROUTE_TRIGGER.txt').unlink(missing_ok=True)
          Path('.github/workflows/fix-reply-archive-route.yml').unlink(missing_ok=True)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/server.py REPLY_ARCHIVE_ROUTE_TRIGGER.txt .github/workflows/fix-reply-archive-route.yml || true
          git commit -m 'Fix reply archive POST route' || exit 0
          git push
