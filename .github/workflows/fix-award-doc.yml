name: Fix award points documentation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.author.name != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update award points documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("Teacher's/index.html")
          s = p.read_text(encoding="utf-8")
          old = '<p class="docs-step-title">Award points with the <strong>+</strong> button.</p>\n        <p class="docs-step-body">Pick a quick award of +10, +7, +15, or +20 — or type any custom positive amount. Scores update live.</p>'
          new = '<p class="docs-step-title"><strong>Award points from the Gradebook.</strong></p>\n        <p class="docs-step-body">Select a student\'s award action to open the Award Score dialog, then choose +10, +7, +15, +20, or enter a custom positive amount.</p>'
          if old not in s:
              raise SystemExit("Target documentation text not found; no changes made.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Teacher's/index.html"
          git commit -m "Correct award points documentation"
          git push
