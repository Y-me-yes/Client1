name: One-off update teacher branding

on:
  push:
    paths:
      - '.github/workflows/one-off-update-teacher-branding.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update teacher page branding
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("Teacher's/index.html")
          text = path.read_text(encoding="utf-8-sig")
          replacements = [
              (
                  '<meta name="description" content="Student Score Tracker — offline-first gradebook for educators.">',
                  '<meta name="description" content="1% Healthy Habit — teacher dashboard for managing students, scores, challenges, and notifications.">',
              ),
              (
                  '<title>Student Score Tracker</title>',
                  '<title>1% Healthy Habit — Teacher</title>',
              ),
              (
                  '<h1 class="brand-title">Student Score Tracker</h1>',
                  '<h1 class="brand-title">1% Healthy Habit</h1>',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Target branding text was not found: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit page change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Teacher's/index.html"
          git commit -m "Align teacher page branding with 1% Healthy Habit"
          git push origin HEAD:main
      - name: Remove one-off workflow
        run: |
          git rm .github/workflows/one-off-update-teacher-branding.yml
          git commit -m "Remove one-off teacher branding workflow"
          git push origin HEAD:main
