name: Apply reply lifecycle
on:
  push:
    paths:
      - '.reply-lifecycle-trigger'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply changes
        shell: python
        run: |
          from pathlib import Path
          import re

          # ---------------- server ----------------
          p = Path('server/server.py')
          s = p.read_text(encoding='utf-8')

          # Active teacher replies exclude archived rows.
          old = '''        by_student: "dict[str, list]" = {}\n        for r in replies:\n            if not isinstance(r, dict):\n                continue\n            u = str(r.get("studentUsername") or "").strip()\n            if not u:\n                continue\n            by_student.setdefault(u, []).append(r)\n'''
          new = '''        by_student: "dict[str, list]" = {}\n        for r in replies:\n            if not isinstance(r, dict) or r.get("archived"):\n                continue\n            u = str(r.get("studentUsername") or "").strip()\n            if not u:\n                continue\n            by_student.setdefault(u, []).append(r)\n'''
          assert old in s, 'server active grouping not found'
          s = s.replace(old, new, 1)

          # New replies start active.
          old = '''                "mediaSize": media_size,\n                "createdAt": now_ms,\n            }\n'''
          new = '''                "mediaSize": media_size,\n                "createdAt": now_ms,\n                "archived": False,\n                "archivedAt": None,\n                "archiveReason": None,\n            }\n'''
          assert old in s, 'server reply row not found'
          s = s.replace(old, new, 1)

          # Add persistent archive endpoint immediately before signout handler.
          marker = '    def _post_signout(self):\n'
          assert marker in s, 'server signout marker not found'
          method = '''    def _post_reply_archive(self):\n        """Archive replies after the teacher closes the Replies popup."""\n        try:\n            body = _read_json(self)\n        except Exception:\n            return _send(self, 400, {"error": "Invalid request body."})\n        err = self._require_teacher(body.get("teacherPassword"))\n        if err is not None:\n            return _send(self, err[0], err[1])\n\n        raw_ids = body.get("ids")\n        if not isinstance(raw_ids, list):\n            return _send(self, 400, {"error": "Reply ids are required."})\n        ids = {str(x).strip() for x in raw_ids if str(x).strip()}\n        if not ids:\n            return _send(self, 200, {"ok": True, "archived": 0})\n\n        now_ms = _rl_now()\n        with _lock:\n            replies = load_replies()\n            if not isinstance(replies, list):\n                replies = []\n            archived = 0\n            for r in replies:\n                if not isinstance(r, dict) or str(r.get("id") or "") not in ids:\n                    continue\n                if r.get("archived"):\n                    continue\n                r["archived"] = True\n                r["archivedAt"] = now_ms\n                r["archiveReason"] = "teacher-reviewed"\n                archived += 1\n            save_replies(replies)\n        return _send(self, 200, {"ok": True, "archived": archived})\n\n    def _get_reply_archive(self):\n        """Return archived replies grouped by student."""\n        with _lock:\n            replies = load_replies()\n        if not isinstance(replies, list):\n            replies = []\n        by_student = {}\n        for r in replies:\n            if not isinstance(r, dict) or not r.get("archived"):\n                continue\n            u = str(r.get("studentUsername") or "").strip()\n            if not u:\n                continue\n            by_student.setdefault(u, []).append(r)\n        for u in by_student:\n            by_student[u].sort(key=lambda r: r.get("archivedAt") or r.get("createdAt") or 0, reverse=True)\n        return _send(self, 200, {"ok": True, "byStudent": by_student})\n\n'''
          s = s.replace(marker, method + marker, 1)

          # GET route must be before the generic /api/replies? route and exact route is harmless.
          get_marker = '''        if self.path == "/api/replies" or self.path.startswith("/api/replies?"):\n            return self._get_replies()\n'''
          get_new = '''        if self.path == "/api/replies/archive":\n            return self._get_reply_archive()\n        if self.path == "/api/replies" or self.path.startswith("/api/replies?"):\n            return self._get_replies()\n'''
          assert get_marker in s, 'GET replies route not found'
          s = s.replace(get_marker, get_new, 1)

          post_marker = '''        elif self.path == "/api/replies":           return self._post_replies()\n'''
          post_new = '''        elif self.path == "/api/replies":           return self._post_replies()\n        elif self.path == "/api/replies/archive":   return self._post_reply_archive()\n'''
          assert post_marker in s, 'POST replies route not found'
          s = s.replace(post_marker, post_new, 1)
          p.write_text(s, encoding='utf-8')

          # ---------------- teacher frontend ----------------
          p = Path("Teacher's/js/app.js")
          s = p.read_text(encoding='utf-8')

          # Remove local-only seen timestamps from state/persistence.
          s = s.replace("    // Per-student \"last seen\" timestamps. The Replies icon shows a\n    // badge with the count of replies newer than the last time the\n    // teacher opened that student's replies dialog. Once the dialog\n    // is opened (and even after closing), the badge clears — the\n    // teacher is now caught up. New replies arriving later will\n    // re-increment the badge above the recorded timestamp.\n    repliesSeenAt: {},\n", "")
          s = s.replace("        // Persist the \"last seen\" timestamps too — without this,\n        // a single page reload would re-show every past reply as\n        // if it were brand new (the badge counts replies whose\n        // createdAt > seenAt).\n        repliesSeenAt: state.repliesSeenAt || {},\n", "")
          s = s.replace("        repliesSeenAt: seen,\n", "")
          s = s.replace("      // `repliesSeenAt` is a map of student username -> ms timestamp\n      // recording when the teacher last opened that student's\n      // replies dialog. We persist it so the badge doesn't reset\n      // to \"all unread\" every time the page is reloaded. Without\n      // this, a single page refresh would re-show every past\n      // reply as if it were brand new.\n      const seen = (parsed.repliesSeenAt && typeof parsed.repliesSeenAt === 'object')\n        ? parsed.repliesSeenAt : {};\n", "")

          # Replace reply actions as one block.
          pattern = re.compile(r"    openRepliesDialog\(username\) \{.*?\n    openRepliesArchiveDialog\(username\) \{.*?\n    \},\n", re.S)
          m = pattern.search(s)
          assert m, 'teacher reply actions block not found'
          replacement = '''    openRepliesDialog(username) {\n      const u = String(username || '').trim();\n      if (!u) return;\n      const list = (state.replies.byStudent && state.replies.byStudent[u]) || [];\n      const openedReplyIds = list.map(r => r && r.id).filter(Boolean);\n      update(s => {\n        s.repliesDialog = { open: true, student: u, items: list, view: 'today', openedReplyIds };\n      });\n      if (!state.replies.byStudent || Object.keys(state.replies.byStudent).length === 0) {\n        return actions.loadReplies();\n      }\n    },\n    closeRepliesDialog() {\n      const ids = (state.repliesDialog && state.repliesDialog.openedReplyIds) || [];\n      const student = state.repliesDialog && state.repliesDialog.student;\n      update(s => { s.repliesDialog = { open: false, student: null, items: [], view: 'today', openedReplyIds: [] }; });\n      if (!ids.length) return;\n      getTeacherPassword().then(teacherPassword => {\n        if (!teacherPassword) {\n          update(s => { s.snackbar = { id: Date.now(), message: "Couldn't archive the replies: teacher sign-in expired" }; });\n          return;\n        }\n        fetch(API_BASE + '/api/replies/archive', {\n          method: 'POST',\n          cache: 'no-store',\n          headers: { 'Content-Type': 'application/json' },\n          body: JSON.stringify({ ids, teacherPassword }),\n        })\n          .then(res => res.json().catch(() => ({})).then(data => ({ res, data })))\n          .then(({ res, data }) => {\n            if (!res.ok || !data.ok) throw new Error(data.error || ('HTTP ' + res.status));\n            const idSet = new Set(ids);\n            update(s => {\n              const current = s.replies.byStudent || {};\n              const next = { ...current };\n              if (student && Array.isArray(next[student])) {\n                next[student] = next[student].filter(r => !idSet.has(r && r.id));\n                if (!next[student].length) delete next[student];\n              }\n              s.replies.byStudent = next;\n            });\n          })\n          .catch(err => {\n            console.warn('archive replies failed:', err);\n            actions.loadReplies();\n            update(s => { s.snackbar = { id: Date.now(), message: "Couldn't archive the replies" }; });\n          });\n      });\n    },\n    openRepliesArchiveDialog(username) {\n      const u = String(username || '').trim();\n      if (!u) return;\n      fetch(API_BASE + '/api/replies/archive', { cache: 'no-store' })\n        .then(res => { if (!res.ok) throw new Error('HTTP ' + res.status); return res.json(); })\n        .then(data => {\n          const by = (data && data.byStudent && typeof data.byStudent === 'object') ? data.byStudent : {};\n          const list = Array.isArray(by[u]) ? by[u] : [];\n          update(s => { s.repliesDialog = { open: true, student: u, items: list, view: 'archive', openedReplyIds: [] }; });\n        })\n        .catch(err => {\n          console.warn('load reply archive failed:', err);\n          update(s => { s.snackbar = { id: Date.now(), message: "Couldn't load the reply archive" }; });\n        });\n    },\n'''
          s = s[:m.start()] + replacement + s[m.end():]

          # Badge is simply active reply count because the server now removes archived rows.
          badge_pattern = re.compile(r"      const list = \(state\.replies\.byStudent && state\.replies\.byStudent\[s\.studentName\]\) \|\| \[\];\n      if \(!list\.length\) return '';\n      const seenAt = .*?      return `<span class=\"replies-badge\" aria-label=\"\$\{unseen\} new replies\">\$\{unseen > 99 \? '99\\+' : unseen\}\}</span>`;\n", re.S)
          bm = badge_pattern.search(s)
          assert bm, 'teacher badge block not found'
          s = s[:bm.start()] + "      const list = (state.replies.byStudent && state.replies.byStudent[s.studentName]) || [];\n      if (!list.length) return '';\n      const count = list.length;\n      return `<span class=\"replies-badge\" aria-label=\"${count} new replies\">${count > 99 ? '99+' : count}</span>`;\n" + s[bm.end():]

          p.write_text(s, encoding='utf-8')
          print('reply lifecycle applied')
